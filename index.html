<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetHazards</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }

    .gps-marker {
      position: relative;
      width: 16px;
      height: 16px;
    }

    .gps-dot {
      width: 14px;
      height: 14px;
      background-color: #2563eb;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .gps-pulse {
      width: 14px;
      height: 14px;
      background-color: #3b82f6;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-ring 2s infinite ease-out;
      z-index: 1;
    }

    @keyframes pulse-ring {
      0% {
        width: 14px;
        height: 14px;
        opacity: 0.8;
      }
      70% {
        width: 44px;
        height: 44px;
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const map = L.map('map').setView([0, 0], 2);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Define custom pulsing icon
const gpsIcon = L.divIcon({
  className: 'gps-marker',
  html: '<div class="gps-pulse"></div><div class="gps-dot"></div>',
  iconSize: [16, 16],
  iconAnchor: [8, 8]
});

// Variables to retain references across updates
let userMarker = null;
let accuracyCircle = null;
let initialCenter = false;

// 1. Enable continuous tracking and high-accuracy GPS
map.locate({
  watch: true,             // Continuously monitor location changes
  enableHighAccuracy: true // Request hardware GPS instead of rough IP/Wi-Fi lookup
});

// 2. Runs continuously whenever the GPS position changes
map.on('locationfound', function(e) {
  const radius = e.accuracy;

  // First fix: center the camera and create the marker
  if (!userMarker) {
    userMarker = L.marker(e.latlng, { icon: gpsIcon }).addTo(map);
    accuracyCircle = L.circle(e.latlng, {
      radius: radius,
      color: '#3b82f6',
      fillColor: '#3b82f6',
      fillOpacity: 0.15,
      weight: 1
    }).addTo(map);

    map.setView(e.latlng, 16);
    initialCenter = true;
  } else {
    // Subsequent updates: move the existing marker smoothly
    userMarker.setLatLng(e.latlng);
    accuracyCircle.setLatLng(e.latlng);
    accuracyCircle.setRadius(radius);
  }
});

map.on('locationerror', function(e) {
  console.warn("Location tracking error:", e.message);
});
  </script>
</body>
</html>
