<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetHazards</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }

    .report-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: #b91c1c;
      color: #ffffff;
      font: 700 14px/1.2 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }

    .report-panel {
      display: none;
      position: fixed;
      top: 72px;
      right: 20px;
      z-index: 1000;
      width: min(360px, calc(100vw - 40px));
      box-sizing: border-box;
      padding: 20px;
      border-radius: 10px;
      background: #ffffff;
      color: #172033;
      font: 14px/1.4 system-ui, sans-serif;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.25);
    }

    .report-panel.is-open {
      display: block;
    }

    .report-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .report-header h1 {
      margin: 0;
      font-size: 20px;
    }

    .report-header p,
    .report-location {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 12px;
    }

    .report-close {
      border: 0;
      background: transparent;
      color: #64748b;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .report-panel label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 700;
    }

    .report-panel select,
    .report-panel textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px;
      color: #172033;
      font: inherit;
    }

    .report-panel textarea {
      min-height: 74px;
      resize: vertical;
    }

    .report-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .report-actions button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font: 700 14px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }

    .report-cancel {
      background: #e2e8f0;
      color: #334155;
    }

    .report-submit {
      background: #b91c1c;
      color: #ffffff;
    }

    .report-submit:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .report-status {
      min-height: 20px;
      margin: 12px 0 0;
      font-size: 13px;
    }

    .report-status.success {
      color: #166534;
    }

    .report-status.error {
      color: #b91c1c;
    }

    .gps-marker {
      position: relative;
      width: 16px;
      height: 16px;
    }

    .gps-dot {
      width: 14px;
      height: 14px;
      background-color: #2563eb;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    .gps-pulse {
      width: 14px;
      height: 14px;
      background-color: #3b82f6;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-ring 2s infinite ease-out;
      z-index: 1;
    }

    @keyframes pulse-ring {
      0% {
        width: 14px;
        height: 14px;
        opacity: 0.8;
      }
      70% {
        width: 44px;
        height: 44px;
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <button class="report-toggle" id="report-toggle" type="button">Report a hazard</button>

  <section class="report-panel" id="report-panel" aria-labelledby="report-title">
    <div class="report-header">
      <div>
        <h1 id="report-title">Report a hazard</h1>
        <p>Click the map to choose a location.</p>
      </div>
      <button class="report-close" id="report-close" type="button" aria-label="Close report form">&times;</button>
    </div>
    <p class="report-location" id="report-location">No location selected</p>
    <form id="report-form">
      <label for="hazard-type">Hazard type</label>
      <select id="hazard-type" required>
        <option value="">Select a hazard</option>
        <option value="Pothole">Pothole</option>
        <option value="Flood">Flood</option>
        <option value="Road block">Road block</option>
        <option value="Broken streetlight">Broken streetlight</option>
        <option value="Other">Other</option>
      </select>
      <label for="hazard-details">Details <span>(optional)</span></label>
      <textarea id="hazard-details" maxlength="300" placeholder="Add useful details about this hazard"></textarea>
      <div class="report-actions">
        <button class="report-cancel" id="report-cancel" type="button">Cancel</button>
        <button class="report-submit" id="report-submit" type="submit">Submit report</button>
      </div>
      <p class="report-status" id="report-status" role="status"></p>
    </form>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgVFIf6hyHjAmAf26rD9HbQcwR2OAyxgo",
      authDomain: "streethazards-2a.firebaseapp.com",
      projectId: "streethazards-2a",
      storageBucket: "streethazards-2a.firebasestorage.app",
      messagingSenderId: "919052017737",
      appId: "1:919052017737:web:b5c19b9261c68a45729f98",
      measurementId: "G-KVJPSJ0JH4"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const hazardsRef = collection(db, "hazards");

    const map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const gpsIcon = L.divIcon({
      className: 'gps-marker',
      html: '<div class="gps-pulse"></div><div class="gps-dot"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    let userMarker = null;
    let accuracyCircle = null;

    map.locate({
      watch: true,
      enableHighAccuracy: true
    });

    map.on('locationfound', function(e) {
      const radius = e.accuracy;

      if (!userMarker) {
        userMarker = L.marker(e.latlng, { icon: gpsIcon }).addTo(map);
        accuracyCircle = L.circle(e.latlng, {
          radius: radius,
          color: '#3b82f6',
          fillColor: '#3b82f6',
          fillOpacity: 0.15,
          weight: 1
        }).addTo(map);

        map.setView(e.latlng, 16);
      } else {
        userMarker.setLatLng(e.latlng);
        accuracyCircle.setLatLng(e.latlng);
        accuracyCircle.setRadius(radius);
      }
    });

    map.on('locationerror', function(e) {
      console.warn(e.message);
    });

    const reportToggle = document.getElementById('report-toggle');
    const reportPanel = document.getElementById('report-panel');
    const reportForm = document.getElementById('report-form');
    const reportClose = document.getElementById('report-close');
    const reportCancel = document.getElementById('report-cancel');
    const reportLocation = document.getElementById('report-location');
    const reportStatus = document.getElementById('report-status');
    const reportSubmit = document.getElementById('report-submit');
    let selectedLocation = null;
    let reportMarker = null;

    function openReportPanel(latlng) {
      selectedLocation = latlng || selectedLocation;
      reportPanel.classList.add('is-open');
      reportStatus.textContent = '';
      reportStatus.className = 'report-status';

      if (selectedLocation) {
        if (!reportMarker) {
          reportMarker = L.marker(selectedLocation).addTo(map);
        } else {
          reportMarker.setLatLng(selectedLocation);
        }
        reportMarker.bindPopup('Selected report location').openPopup();
        reportLocation.textContent = `Location: ${selectedLocation.lat.toFixed(5)}, ${selectedLocation.lng.toFixed(5)}`;
      }
    }

    function closeReportPanel() {
      reportPanel.classList.remove('is-open');
      reportForm.reset();
      selectedLocation = null;
      if (reportMarker) {
        map.removeLayer(reportMarker);
        reportMarker = null;
      }
      reportLocation.textContent = 'No location selected';
      reportStatus.textContent = '';
    }

    reportToggle.addEventListener('click', () => openReportPanel());
    reportClose.addEventListener('click', closeReportPanel);
    reportCancel.addEventListener('click', closeReportPanel);

    map.on('click', function(e) {
      openReportPanel(e.latlng);
    });

    reportForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!selectedLocation) {
        reportStatus.textContent = 'Click the map to choose a location first.';
        reportStatus.className = 'report-status error';
        return;
      }

      reportSubmit.disabled = true;
      reportStatus.textContent = 'Submitting report...';
      reportStatus.className = 'report-status';

      try {
        await addDoc(hazardsRef, {
          type: document.getElementById('hazard-type').value,
          details: document.getElementById('hazard-details').value.trim(),
          lat: selectedLocation.lat,
          lng: selectedLocation.lng,
          createdAt: serverTimestamp()
        });
        reportStatus.textContent = 'Report submitted. Thank you.';
        reportStatus.className = 'report-status success';
        reportForm.reset();
        selectedLocation = null;
        if (reportMarker) {
          map.removeLayer(reportMarker);
          reportMarker = null;
        }
        reportLocation.textContent = 'No location selected';
      } catch (err) {
        console.error(err);
        reportStatus.textContent = 'Could not submit the report. Please try again.';
        reportStatus.className = 'report-status error';
      } finally {
        reportSubmit.disabled = false;
      }
    });

    onSnapshot(hazardsRef, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const data = change.doc.data();

          L.circleMarker([data.lat, data.lng], {
            radius: 8,
            fillColor: "#ef4444",
            color: "#991b1b",
            weight: 2,
            fillOpacity: 0.8
          })
          .addTo(map)
          .bindPopup(`<b>Hazard:</b> ${data.type}${data.details ? `<br>${data.details}` : ''}`);
        }
      });
    });
  </script>
</body>
</html>
