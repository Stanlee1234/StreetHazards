<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetHazards</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="hazards-sidebar" aria-labelledby="hazards-title">
    <div class="hazards-sidebar-header">
      <h1 id="hazards-title">Closest hazards</h1>
      <button class="hazards-sidebar-toggle" id="hazards-sidebar-toggle" type="button" aria-label="Minimize hazards sidebar" aria-expanded="true">&lsaquo;</button>
    </div>
    <p id="hazards-status">Locating you...</p>
    <div class="hazard-tabs" role="tablist" aria-label="Hazard views">
      <button class="hazard-tab is-active" id="nearby-hazards-tab" type="button" role="tab" aria-selected="true">Closest hazards</button>
      <button class="hazard-tab" id="my-hazards-tab" type="button" role="tab" aria-selected="false">My hazards</button>
    </div>
    <div class="hazard-list" id="hazard-list" aria-live="polite">
      <p class="hazard-empty">Loading hazards...</p>
    </div>
    <button class="report-toggle" id="report-toggle" type="button">Report a hazard</button>
  </aside>

  <div id="map"></div>
  <form class="place-search" id="place-search" role="search">
    <label class="sr-only" for="place-search-input">Search for a restaurant or landmark</label>
    <input id="place-search-input" type="search" placeholder="Search restaurants and landmarks" autocomplete="off" />
    <button class="place-search-submit" type="submit" aria-label="Search">
      <span class="search-icon" aria-hidden="true"></span>
      <span class="sr-only">Search</span>
    </button>
    <div class="place-search-results" id="place-search-results" role="listbox" aria-live="polite"></div>
  </form>
  <div class="auth-controls">
    <span class="sr-only" id="auth-status">Sign in to report or vote</span>
    <button id="auth-button" type="button">Sign in</button>
  </div>

  <section class="report-panel" id="report-panel" aria-labelledby="report-title">
    <div class="report-header">
      <div>
        <h1 id="report-title">Report a hazard</h1>
        <p>Click the map to choose a location.</p>
      </div>
      <button class="report-close" id="report-close" type="button" aria-label="Close report form">&times;</button>
    </div>
    <p class="report-location" id="report-location">No location selected</p>
    <div class="report-auth-notice" id="report-auth-notice" role="status">
      <strong>Sign in required</strong>
      <span>Sign in with Google before submitting a hazard report.</span>
      <button id="report-auth-button" type="button">Sign in with Google</button>
    </div>
    <form id="report-form">
      <label for="hazard-type">Hazard type</label>
      <select id="hazard-type" required>
        <option value="">Select a hazard</option>
        <option value="Pothole">Pothole</option>
        <option value="Crash">Crash</option>
        <option value="Road block">Road block</option>
        <option value="Other">Other</option>
      </select>
      <div class="custom-hazard-field" id="custom-hazard-field" hidden>
        <label for="custom-hazard-type">Custom hazard</label>
        <input id="custom-hazard-type" type="text" maxlength="80" placeholder="Describe the hazard" />
      </div>
      <label for="hazard-details">Details <span>(optional)</span></label>
      <textarea id="hazard-details" maxlength="300" placeholder="Add useful details about this hazard"></textarea>
      <div class="report-actions">
        <button class="report-cancel" id="report-cancel" type="button">Cancel</button>
        <button class="report-submit" id="report-submit" type="submit">Submit report</button>
      </div>
      <p class="report-status" id="report-status" role="status"></p>
    </form>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="script.js"></script>
</body>
</html>
